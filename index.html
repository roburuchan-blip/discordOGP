<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="discordOGP">
  <meta property="og:title" content="discordOGP サンプルカード">
  <meta property="og:description" content="DiscordでURLを貼ったときに見えるOGPカードです。タイトル・説明・画像を簡単に編集して使えます。">
  <meta property="og:image" content="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80">
  <meta property="og:image:alt" content="Discord OGP サンプル画像">
  <meta name="theme-color" content="#5865f2">
  <meta name="twitter:card" content="summary_large_image">

  <title>discordOGP | サンプル</title>

  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --panel-alt: #0f172a;
      --line: #5865f2;
      --text: #f3f4f6;
      --muted: #cbd5e1;
      --soft: #94a3b8;
      --tag: rgba(88, 101, 242, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #1f2937 0%, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      width: min(560px, 100%);
      background: linear-gradient(180deg, rgba(31, 41, 55, 0.98), rgba(17, 24, 39, 0.98));
      border-left: 4px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
    }

    .content {
      padding: 22px 22px 18px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--tag);
      color: #dbeafe;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 10px;
      font-size: clamp(1.5rem, 2.8vw, 2rem);
      line-height: 1.25;
      color: #ffffff;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      white-space: pre-wrap;
      font-size: 0.98rem;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      margin-top: 18px;
      border: 1px solid rgba(148, 163, 184, 0.22);
    }

    .note {
      margin-top: 18px;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 8px;
      color: var(--soft);
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="content">
      <span class="badge">Discord OGP</span>
      <h1>discordOGP サンプルカード</h1>
      <p>DiscordでURLを貼ったときに見えるOGPカードです。
タイトル・説明・画像を編集して、あなたのサイトや作品の紹介ページをすぐに作れます。</p>

      <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80" alt="OGP card preview image">

      <div class="note">
        ※ このページは静的HTMLです。<br>
        head 内の meta タグと本文を編集すると、Discordカードの表示内容を変えられます。
      </div>
    </div>
  </main>
</body>
</html>
