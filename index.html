<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="サラミのプロフィール。制作したスクリプトやアプリ、SNSへのリンクを掲載しています。">
<title>サラミ | Profile</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root { --radius: 16px; --maxw: 600px; }

  :root[data-theme="dark"] {
    --bg: #0f172a; --glow1: rgba(56,189,248,.25); --glow2: rgba(139,92,246,.22);
    --surface: #1e293b; --surface-hover: #26344a; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --accent2: #8b5cf6; --accent-soft: rgba(56,189,248,.14);
    --border: #334155; --shadow: 0 10px 30px rgba(0,0,0,.35); --avatar-bg: #1e293b;
    --dot: rgba(148,163,184,.18);
  }
  :root[data-theme="light"] {
    --bg: #f8fafc; --glow1: rgba(14,165,233,.20); --glow2: rgba(168,85,247,.16);
    --surface: #fff; --surface-hover: #f1f5f9; --text: #0f172a; --muted: #64748b;
    --accent: #0ea5e9; --accent2: #a855f7; --accent-soft: rgba(14,165,233,.10);
    --border: #e2e8f0; --shadow: 0 10px 30px rgba(15,23,42,.08); --avatar-bg: #eef6ff;
    --dot: rgba(100,116,139,.18);
  }
  :root[data-theme="sakura"] {
    --bg: #fff1f5; --glow1: rgba(236,72,153,.24); --glow2: rgba(251,146,60,.18);
    --surface: #fff; --surface-hover: #ffe4ed; --text: #4a2c3a; --muted: #a5808f;
    --accent: #ec4899; --accent2: #fb923c; --accent-soft: rgba(236,72,153,.10);
    --border: #fbcfe0; --shadow: 0 10px 30px rgba(236,72,153,.10); --avatar-bg: #ffe4ed;
    --dot: rgba(236,72,153,.18);
  }
  :root[data-theme="forest"] {
    --bg: #0d1f17; --glow1: rgba(52,211,153,.24); --glow2: rgba(56,189,248,.16);
    --surface: #16302a; --surface-hover: #1d3d35; --text: #d1fae5; --muted: #6ee7b7;
    --accent: #34d399; --accent2: #38bdf8; --accent-soft: rgba(52,211,153,.12);
    --border: #22503f; --shadow: 0 10px 30px rgba(0,0,0,.35); --avatar-bg: #16302a;
    --dot: rgba(110,231,183,.16);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; justify-content: center; padding: 76px 20px 56px; line-height: 1.7;
    position: relative; overflow-x: hidden; transition: background .4s, color .4s;
  }
  .bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg-layer .glow1 {
    position: absolute; top: -240px; left: 50%; transform: translateX(-50%);
    width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, var(--glow1), transparent 70%); transition: background .4s;
  }
  .bg-layer .glow2 {
    position: absolute; bottom: -260px; right: -180px; width: 560px; height: 560px;
    border-radius: 50%; background: radial-gradient(circle, var(--glow2), transparent 70%);
    transition: background .4s;
  }
  .bg-layer .dots {
    position: absolute; inset: 0; background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 26px 26px; transition: background-image .4s;
  }
  .themes {
    position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; padding: 8px 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    box-shadow: var(--shadow); z-index: 10; transition: background .4s, border-color .4s;
  }
  .theme-dot {
    width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--c); padding: 0; transition: transform .15s, box-shadow .15s;
  }
  .theme-dot:hover { transform: scale(1.15); }
  .theme-dot:focus-visible, .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .theme-dot.active { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c); }
  .wrap { width: 100%; max-width: var(--maxw); position: relative; z-index: 1; animation: fadeUp .6s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .profile-head { text-align: center; margin-bottom: 42px; }
  .avatar-stage {
    position: relative; width: 132px; height: 132px; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar-stage::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--accent), var(--accent2), var(--accent));
    animation: spin 8s linear infinite; opacity: .85; transition: background .4s;
  }
  .avatar-stage::after {
    content: ""; position: absolute; inset: -18px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent-soft), transparent 70%);
    filter: blur(6px); z-index: -1; transition: background .4s;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .avatar {
    position: relative; width: 118px; height: 118px; border-radius: 50%; background: var(--avatar-bg);
    border: 4px solid var(--bg); overflow: hidden; display: flex; align-items: center;
    justify-content: center; transition: background .4s, border-color .4s; z-index: 1;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar .initial { font-size: 2.6rem; font-weight: 700; color: var(--accent); transition: color .4s; }
  h1 { font-size: 1.9rem; letter-spacing: -.02em; }
  .tagline { color: var(--accent); font-size: .95rem; font-weight: 600; margin-top: 4px; transition: color .4s; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; font-size: .78rem;
    font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px;
    transition: color .4s, background .4s;
  }
  .badge svg { width: 14px; height: 14px; }
  .section { margin-bottom: 38px; }
  .section-label {
    font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
    font-weight: 600; margin-bottom: 14px; transition: color .4s;
  }
  .about { font-size: .95rem; color: var(--text); }
  .about p + p { margin-top: 8px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 14px; padding: 15px 18px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); color: var(--text);
    text-decoration: none; font-weight: 500; font-size: .95rem; box-shadow: var(--shadow);
    transition: transform .18s, background .18s, border-color .18s, color .4s;
  }
  .link:hover { transform: translateY(-2px); background: var(--surface-hover); border-color: var(--brand, var(--accent)); }
  .link .ico {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: 9px; display: flex;
    align-items: center; justify-content: center; background: var(--surface-hover);
  }
  .link .ico svg { width: 18px; height: 18px; color: var(--brand); }
  .link .arrow { margin-left: auto; color: var(--muted); font-size: .9rem; }
  .link[data-brand="tiktok"] { --brand: #25f4ee; }
  .link[data-brand="discord"] { --brand: #5865f2; }
  .link[data-brand="mirrativ"] { --brand: #ff4d6d; }
  .link[data-brand="roblox"] { --brand: #e2231a; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 44px; transition: color .4s; }
  @media (max-width: 480px) {
    body { padding: 68px 16px 40px; }
    h1 { font-size: 1.6rem; }
    .avatar-stage { width: 112px; height: 112px; }
    .avatar { width: 100px; height: 100px; }
    .themes { top: 14px; right: 14px; padding: 7px 10px; gap: 8px; }
    .theme-dot { width: 19px; height: 19px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<script>
  const root = document.documentElement;
  const dots = document.querySelectorAll('.theme-dot');
  const themeColors = { dark: '#0f172a', light: '#f8fafc', sakura: '#fff1f5', forest: '#0d1f17' };
  function setTheme(name) {
    const theme = Object.hasOwn(themeColors, name) ? name : 'dark';
    root.setAttribute('data-theme', theme);
    document.querySelector('meta[name="theme-color"]').content = themeColors[theme];
    dots.forEach(dot => {
      const active = dot.dataset.theme === theme;
      dot.classList.toggle('active', active);
      dot.setAttribute('aria-pressed', String(active));
    });
    try { localStorage.setItem('profile-theme', theme); } catch (e) {}
  }
  dots.forEach(dot => dot.addEventListener('click', () => setTheme(dot.dataset.theme)));
  let saved = null;
  try { saved = localStorage.getItem('profile-theme'); } catch (e) {}
  setTheme(saved || 'dark');
</script>
