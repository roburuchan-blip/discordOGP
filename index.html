<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGPリンク生成</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; background:#1e1f22; color:#dbdee1;
    font-family:system-ui,sans-serif; padding:24px;
    display:flex; justify-content:center;
  }
  .app{width:100%; max-width:520px;}
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:#949ba4; font-size:13px; margin-bottom:20px;}
  .card{
    background:#2b2d31; border:1px solid #3f4147;
    border-radius:10px; padding:16px; margin-bottom:16px;
  }
  label{display:block; font-size:12px; color:#949ba4; margin:10px 0 4px;}
  label:first-child{margin-top:0;}
  input, textarea, select{
    width:100%; padding:10px; border-radius:6px;
    border:1px solid #3f4147; background:#1e1f22; color:#fff;
    font-size:14px; font-family:inherit; outline:none;
  }
  input:focus, textarea:focus{border-color:#5865f2;}
  textarea{resize:vertical; min-height:70px;}
  .row{display:flex; gap:8px;}
  .row > div{flex:1;}
  button{
    width:100%; padding:12px; margin-top:12px;
    border:none; border-radius:6px; cursor:pointer;
    background:#5865f2; color:#fff; font-size:15px; font-weight:600;
  }
  button:hover{filter:brightness(1.1);}
  .btn-dl{background:#248046;}
  .preview{
    margin-top:12px; border-left:4px solid #5865f2;
    background:#2b2d31; border-radius:4px; padding:12px;
  }
  .preview .pt{font-weight:600; margin-bottom:4px;}
  .preview .pd{color:#b5bac1; font-size:13px; white-space:pre-wrap;}
  .preview img{max-width:100%; border-radius:4px; margin-top:8px;}
  .note{font-size:11px; color:#80848e; margin-top:8px; line-height:1.5;}
</style>
</head>
<body>
<div class="app">
  <h1>🔗 OGPリンク生成</h1>
  <div class="sub">入力 → HTMLをダウンロード → GitHubにアップロード → Discordに貼る</div>

  <div class="card">
    <label>タイトル</label>
    <input id="title" placeholder="例: 今日の告知" maxlength="256">

    <label>説明</label>
    <textarea id="desc" placeholder="例: 20時から配信します！" maxlength="4096"></textarea>

    <label>画像URL（httpsのみ・任意）</label>
    <input id="img" placeholder="https://example.com/image.png">

    <label>サイト名（任意）</label>
    <input id="site" placeholder="例: マイページ" maxlength="64">

    <label>色</label>
    <input type="color" id="color" value="#5865f2" style="height:44px;padding:2px;cursor:pointer;">

    <button class="btn-dl" onclick="downloadHtml()">⬇ HTMLをダウンロード</button>
  </div>

  <div class="card">
    <label>プレビュー（Discord風）</label>
    <div class="preview" id="preview">
      <div class="pt" id="pvT" style="color:#80848e;">タイトル</div>
      <div class="pd" id="pvD"></div>
    </div>
    <div class="note">
      ダウンロードしたHTMLをGitHub Pagesにアップロードすると、Discordに貼ったときカードが表示されます。
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function updatePreview(){
  $('pvT').textContent = $('title').value || 'タイトル';
  $('pvD').textContent = $('desc').value;
  $('preview').style.borderLeftColor = $('color').value;
}

['title','desc','color'].forEach(id => {
  $(id).addEventListener('input', updatePreview);
});

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function downloadHtml(){
  const title = $('title').value.trim();
  const desc  = $('desc').value.trim();
  const img   = $('img').value.trim();
  const site  = $('site').value.trim();
  const color = $('color').value;

  if(!title && !desc){
    alert('タイトルか説明を入れてください');
    return;
  }
  if(img && !/^https:\/\//i.test(img)){
    alert('画像URLは https:// で始めてください');
    return;
  }

  const html = `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta property="og:type" content="website">
<meta property="og:title" content="${esc(title)}">
<meta property="og:description" content="${esc(desc)}">
${img ? `<meta property="og:image" content="${esc(img)}">` : ''}
${site ? `<meta property="og:site_name" content="${esc(site)}">` : ''}
<meta name="theme-color" content="${color}">
<title>${esc(title || 'OGP')}</title>
<style>
body{margin:0;background:#1e1f22;color:#dbdee1;font-family:system-ui,sans-serif;padding:24px;display:flex;justify-content:center;}
.c{background:#2b2d31;border-left:4px solid ${color};border-radius:8px;padding:20px;max-width:520px;width:100%;}
h1{font-size:20px;margin:0 0 8px;color:#fff;}
p{color:#b5bac1;line-height:1.6;white-space:pre-wrap;}
img{max-width:100%;border-radius:6px;margin-top:12px;}
</style>
</head>
<body>
<div class="c">
<h1>${esc(title)}</h1>
<p>${esc(desc)}</p>
${img ? `<img src="${esc(img)}" alt="">` : ''}
</div>
</body>
</html>`;

  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
