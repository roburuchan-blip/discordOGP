<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>埋め込みリンク生成</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; background:#1e1f22; color:#dbdee1;
    font-family:system-ui,sans-serif; padding:20px;
    display:flex; justify-content:center;
  }
  .app{width:100%; max-width:520px;}
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:#949ba4; font-size:13px; margin-bottom:20px;}
  .card{
    background:#2b2d31; border:1px solid #3f4147;
    border-radius:10px; padding:16px; margin-bottom:16px;
  }
  label{display:block; font-size:12px; color:#949ba4; margin:12px 0 4px;}
  label:first-child{margin-top:0;}
  input, textarea, select{
    width:100%; padding:10px; border-radius:6px;
    border:1px solid #3f4147; background:#1e1f22; color:#fff;
    font-size:14px; font-family:inherit; outline:none;
  }
  input:focus, textarea:focus{border-color:#5865f2;}
  textarea{resize:vertical; min-height:70px;}
  input[type=color]{height:44px;padding:2px;cursor:pointer;}
  
  button{
    width:100%; padding:14px; margin-top:16px;
    border:none; border-radius:6px; cursor:pointer;
    background:#5865f2; color:#fff; font-size:16px; font-weight:600;
    transition: 0.2s;
  }
  button:hover{filter:brightness(1.1);}
  
  .result{
    margin-top:16px; padding:12px; background:#1e1f22;
    border-radius:6px; border:1px solid #3f4147;
    display:none;
  }
  .result.show{display:block;}
  .result p{margin:0 0 8px; font-size:13px; color:#3ba55d; font-weight:bold;}
  .url-box{display:flex; gap:8px;}
  .url-box input{flex:1; font-size:12px; color:#00a8fc;}
  .btn-copy{width:auto; margin:0; padding:0 16px; background:#4f545c; font-size:13px;}
  
  .note{font-size:11px; color:#80848e; margin-top:8px; line-height:1.5;}
</style>
</head>
<body>
<div class="app">
  <h1>🔗 埋め込みリンク生成</h1>
  <div class="sub">入力して生成 → Discordに貼るだけでカード表示</div>

  <div class="card">
    <label>タイトル</label>
    <input id="title" placeholder="例: ��日の告知" maxlength="256">

    <label>説明</label>
    <textarea id="desc" placeholder="例: 20時から配信します！" maxlength="4096"></textarea>

    <label>画像URL（httpsのみ・任意）</label>
    <input id="img" placeholder="https://example.com/image.png">

    <label>サイト名（任意）</label>
    <input id="site" placeholder="例: マイページ" maxlength="64">

    <label>色</label>
    <input type="color" id="color" value="#5865f2">

    <button onclick="generate()">✨ リンクを生成</button>
  </div>

  <div class="result" id="result">
    <p>✅ リンクができました！Discordに貼ってください</p>
    <div class="url-box">
      <input type="text" id="outUrl" readonly onclick="this.select()">
      <button class="btn-copy" onclick="copyUrl()">コピー</button>
    </div>
    <div class="note" style="margin-top:10px;">
      ※ 反映されない時は、URLの後ろに `&v=1` などを付けてみてください（Discordのキャッシュ対策）
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function generate() {
  const title = $('title').value.trim();
  const desc  = $('desc').value.trim();
  const img   = $('img').value.trim();
  const site  = $('site').value.trim();
  const color = $('color').value.replace('#', '');

  if (!title && !desc) {
    alert('タイトルか説明を入力してください');
    return;
  }

  // あなたのGitHubのURLをベースにします
  // ※ここにあなたが作ったページのURLが入ります
  const baseUrl = "https://roburuchan-blip.github.io/discordOGP/";
  
  // URLパラメータを作成
  const params = new URLSearchParams();
  if (title) params.set('t', title);
  if (desc)  params.set('d', desc);
  if (img)   params.set('i', img);
  if (site)  params.set('s', site);
  if (color) params.set('c', color);

  // 生成されたURL
  const finalUrl = baseUrl + '?' + params.toString();

  $('outUrl').value = finalUrl;
  $('result').classList.add('show');
  $('result').scrollIntoView({behavior:'smooth', block:'start'});
}

function copyUrl() {
  const input = $('outUrl');
  input.select();
  document.execCommand('copy');
  alert('コピーしました！Discordに貼ってください');
}
</script>
</body>
</html>
