<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Webhook Embed 送信</title>
<style>
  :root{--bg:#1e1f22;--panel:#2b2d31;--text:#dbdee1;--muted:#949ba4;--accent:#5865f2;--border:#3f4147;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:24px;}
  .app{width:100%;max-width:560px;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;}
  label:first-child{margin-top:0;}
  input,textarea{width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--border);background:#1e1f22;color:var(--text);font-size:14px;outline:none;}
  input:focus,textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:80px;}
  .color-wrap{display:flex;gap:8px;align-items:center;}
  input[type=color]{width:48px;height:38px;padding:2px;border-radius:6px;border:1px solid var(--border);background:#1e1f22;cursor:pointer;}
  input[type=text]{flex:1;}
  button{width:100%;padding:12px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;}
  button:hover{filter:brightness(1.1);}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .status{margin-top:12px;font-size:13px;text-align:center;}
  .status.ok{color:#57f287;}
  .status.err{color:#ed4245;}
</style>
</head>
<body>
<div class="app">
  <h1>Discord Webhook 送信</h1>
  <div class="sub">入力して送信 → 指定チャンネルに埋め込みが投稿されます</div>

  <div class="card">
    <label for="wh">Webhook URL</label>
    <input type="url" id="wh" placeholder="https://discord.com/api/webhooks/..." >

    <label for="title">タイトル</label>
    <input type="text" id="title" placeholder="例: 今日の告知" maxlength="256">

    <label for="desc">説明</label>
    <textarea id="desc" placeholder="例: 20時から配信します！" maxlength="2000"></textarea>

    <label for="img">画像URL（任意）</label>
    <input type="url" id="img" placeholder="https://example.com/image.png">

    <label for="color">色</label>
    <div class="color-wrap">
      <input type="color" id="color" value="#5865f2">
      <input type="text" id="colorHex" value="#5865f2" maxlength="7">
    </div>

    <button id="sendBtn">Discordに送信</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// 色の同期
$('color').addEventListener('input', e => { $('colorHex').value = e.target.value; });
$('colorHex').addEventListener('input', e => {
  let v = e.target.value.trim();
  if (!v.startsWith('#')) v = '#' + v;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) { $('color').value = v; e.target.value = v; }
});

// HEX → 10進数（Discordのcolorフィールドは数値）
function hexToDecimal(hex) {
  return parseInt(hex.replace('#',''), 16);
}

$('sendBtn').addEventListener('click', async () => {
  const wh = $('wh').value.trim();
  const title = $('title').value.trim();
  const desc = $('desc').value.trim();
  const img = $('img').value.trim();
  const colorHex = $('color').value;

  if (!wh) { setStatus('Webhook URLを入力してください', 'err'); return; }
  if (!title && !desc) { setStatus('タイトルか説明を入力してください', 'err'); return; }

  // 埋め込みオブジェクト構築
  const embed = {};
  if (title) embed.title = title;
  if (desc) embed.description = desc;
  embed.color = hexToDecimal(colorHex);
  if (img) embed.image = { url: img };

  const payload = { embeds: [embed] };

  $('sendBtn').disabled = true;
  setStatus('送信中...', '');

  try {
    const res = await fetch(wh, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      setStatus('送信しました ✓', 'ok');
    } else {
      const err = await res.text();
      setStatus('送信失敗: ' + res.status + ' ' + err.slice(0, 120), 'err');
    }
  } catch (e) {
    setStatus('通信エラー: ' + e.message, 'err');
  } finally {
    $('sendBtn').disabled = false;
  }
});

function setStatus(msg, cls) {
  const s = $('status');
  s.textContent = msg;
  s.className = 'status ' + (cls || '');
}
</script>
</body>
</html>
