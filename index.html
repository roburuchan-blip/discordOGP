<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ============================================ -->
<!-- ↓↓↓ ここを編集（Discordカードに反映される） ↓↓↓ -->
<!-- ============================================ -->

<!-- タイトル（カードの見出し・最大256文字） -->
<meta property="og:title" content="ここにタイトル">

<!-- 説明（カードの本文・最大4096文字） -->
<meta property="og:description" content="ここに説明文を書きます。">

<!-- 画像URL（https必須・任意） -->
<!-- <meta property="og:image" content="https://example.com/image.png"> -->

<!-- サイト名（任意） -->
<meta property="og:site_name" content="Discord パネル">

<!-- テーマカラー（カード左端の色） -->
<meta name="theme-color" content="#5865f2">

<!-- ============================================ -->
<!-- ↑↑↑ ここを編集 ↑↑↑ -->
<!-- ============================================ -->

<meta property="og:type" content="website">
<title>Discord パネル</title>

<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:#1e1f22; color:#dbdee1;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; justify-content:center; align-items:center;
    padding:24px;
  }
  .card{
    background:#2b2d31; border-left:4px solid #5865f2;
    border-radius:8px; padding:20px; max-width:520px; width:100%;
  }
  h1{font-size:20px; margin:0 0 8px; color:#fff;}
  p{color:#b5bac1; line-height:1.6; white-space:pre-wrap;}
  img{max-width:100%; border-radius:6px; margin-top:12px;}
  .note{
    margin-top:20px; padding:10px;
    background:#1e1f22; border-radius:6px;
    font-size:12px; color:#949ba4; line-height:1.6;
  }
</style>
</head>
<body>
<div class="card">
  <!-- ↓ 表示用（Discordカードとは別。ブラウザで開いたとき用） -->
  <h1>ここにタイトル</h1>
  <p>ここに説明文を書きます。</p>
  <!-- <img src="https://example.com/image.png" alt=""> -->

  <div class="note">
    ※ このページはOGPタグを埋め込んだ静的HTMLです。<br>
    URLをDiscordに貼るとカードが表示されます。
  </div>
</div>
</body>
</html>
