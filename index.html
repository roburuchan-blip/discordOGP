<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OGPカード生成</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #1e1f22;
      color: #dbdee1;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
      color: #fff;
    }

    .sub {
      color: #949ba4;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .card {
      background: #2b2d31;
      border: 1px solid #3f4147;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 12px;
      color: #949ba4;
    }

    label:first-child {
      margin-top: 0;
    }

    input, textarea {
      width: 100%;
      border: 1px solid #3f4147;
      background: #1e1f22;
      color: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, textarea:focus {
      border-color: #5865f2;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input[type="color"] {
      height: 44px;
      padding: 4px;
      cursor: pointer;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #5865f2;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.2s ease;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .preview {
      background: #2b2d31;
      border-left: 4px solid #5865f2;
      border-radius: 8px;
      padding: 18px;
      margin-top: 10px;
    }

    .preview .title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px;
      color: #fff;
      line-height: 1.3;
    }

    .preview .desc {
      color: #b5bac1;
      line-height: 1.6;
      white-space: pre-wrap;
      margin: 0;
    }

    .preview img {
      display: block;
      max-width: 100%;
      border-radius: 8px;
      margin-top: 14px;
    }

    .note {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.6;
      color: #80848e;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🔗 OGPカード生成</h1>
    <div class="sub">
      入力してHTMLをダウンロードしてください。<br>
      生成したHTMLをGitHub Pagesや静的ホスティングに置けば、Discordに貼ったときにカードが表示されます。
    </div>

    <div class="card">
      <label>タイトル</label>
      <input id="title" maxlength="256" placeholder="例: 今日の告知">

      <label>説明</label>
      <textarea id="desc" maxlength="4096" placeholder="例: 20時から配信します！"></textarea>

      <label>画像URL（httpsのみ・任意）</label>
      <input id="img" placeholder="https://example.com/image.jpg">

      <label>サイト名（任意）</label>
      <input id="site" maxlength="64" placeholder="例: マイページ">

      <label>色</label>
      <input type="color" id="color" value="#5865f2">

      <button onclick="downloadHtml()">⬇ HTMLをダウンロード</button>
    </div>

    <div class="card">
      <label>プレビュー（Discord風）</label>
      <div class="preview" id="preview">
        <div class="title" id="pvTitle">タイトル</div>
        <p class="desc" id="pvDesc">説明文を入力するとここに表示されます。</p>
        <img id="pvImg" src="" alt="" style="display:none;">
      </div>
      <div class="note">
        Discord は JavaScript を実行せず、HTML の meta タグを読んでカードを作るため、<br>
        生成した静的 HTML をそのまま公開する方法が正しい使い方です。
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function updatePreview() {
      const title = $('title').value.trim() || 'タイトル';
      const desc = $('desc').value.trim() || '説明文を入力するとここに表示されます。';
      const img = $('img').value.trim();
      const color = $('color').value;

      $('pvTitle').textContent = title;
      $('pvDesc').textContent = desc;
      $('preview').style.borderLeftColor = color;

      const imgEl = $('pvImg');
      if (img) {
        imgEl.src = img;
        imgEl.style.display = 'block';
      } else {
        imgEl.src = '';
        imgEl.style.display = 'none';
      }
    }

    ['title', 'desc', 'img', 'color'].forEach((id) => {
      $(id).addEventListener('input', updatePreview);
    });

    function escHtml(str) {
      return String(str).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    function downloadHtml() {
      const title = $('title').value.trim();
      const desc = $('desc').value.trim();
      const img = $('img').value.trim();
      const site = $('site').value.trim();
      const color = $('color').value;

      if (!title && !desc) {
        alert('タイトルか説明を入力してください');
        return;
      }

      if (img && !/^https:\/\//i.test(img)) {
        alert('画像URLは https:// で始めてください');
        return;
      }

      const html = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="${escHtml(title || 'OGPカード')}">
  <meta property="og:description" content="${escHtml(desc || '説明文なし')}">
  ${img ? `<meta property="og:image" content="${escHtml(img)}">` : ''}
  ${site ? `<meta property="og:site_name" content="${escHtml(site)}">` : ''}
  <meta name="theme-color" content="${color}">
  <meta name="twitter:card" content="summary_large_image">
  <title>${escHtml(title || 'OGPカード')}</title>
  <style>
    body {
      margin: 0;
      background: #1e1f22;
      color: #dbdee1;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: #2b2d31;
      border-left: 4px solid ${color};
      border-radius: 12px;
      padding: 20px 20px 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      color: #fff;
      line-height: 1.3;
    }
    p {
      margin: 0;
      color: #b5bac1;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 14px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>${escHtml(title || 'OGPカード')}</h1>
    <p>${escHtml(desc || '説明文なし')}</p>
    ${img ? `<img src="${escHtml(img)}" alt="">` : ''}
  </div>
</body>
</html>`;

      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      a.click();
      URL.revokeObjectURL(url);
    }

    updatePreview();
  </script>
</body>
</html>
