<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="タイトル未設定">
  <meta property="og:description" content="説明がありません。">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#5865f2">
  <title>Discord OGP</title>
  <style>
    body {
      margin: 0; min-height: 100vh; background: #1e1f22; color: #dbdee1;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: #2b2d31;
      border-left: 4px solid #5865f2;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
    }
    .card h1 {
      margin: 0 0 10px; font-size: 22px; line-height: 1.3; color: #fff;
    }
    .card p {
      margin: 0; color: #b5bac1; line-height: 1.7; white-space: pre-wrap;
    }
    .card img {
      display: block; width: 100%; height: auto; border-radius: 10px; margin-top: 14px;
    }
  </style>
  <script>
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    function applyMeta() {
      const params = new URLSearchParams(window.location.search);
      const title = params.get('t') || 'タイトル未設定';
      const desc = params.get('d') || '説明がありません。';
      const img = params.get('i') || '';
      const site = params.get('s') || '';
      const color = params.get('c') || '5865f2';

      document.title = title;
      document.querySelector('meta[property="og:title"]').setAttribute('content', title);
      document.querySelector('meta[property="og:description"]').setAttribute('content', desc);
      if (img) {
        document.querySelector('meta[name="twitter:card"]').setAttribute('content', 'summary_large_image');
        const ogImg = document.createElement('meta');
        ogImg.setAttribute('property', 'og:image');
        ogImg.setAttribute('content', img);
        document.head.appendChild(ogImg);
      }
      if (site) {
        const ogSite = document.createElement('meta');
        ogSite.setAttribute('property', 'og:site_name');
        ogSite.setAttribute('content', site);
        document.head.appendChild(ogSite);
      }
      const theme = document.querySelector('meta[name="theme-color"]');
      theme.setAttribute('content', '#' + color);

      const page = document.createElement('div');
      page.className = 'card';
      page.innerHTML = `
        <h1>${escapeHtml(title)}</h1>
        <p>${escapeHtml(desc)}</p>
        ${img ? `<img src="${escapeHtml(img)}" alt="">` : ''}
      `;
      document.body.innerHTML = '';
      document.body.appendChild(page);

      const cardEl = document.querySelector('.card');
      cardEl.style.borderLeftColor = '#' + color;
    }

    window.addEventListener('DOMContentLoaded', applyMeta);
  </script>
</head>
<body>
</body>
</html>
